[project]
name = "kasimargin"
version = "0.3.0"
description = "Local SME cash decision prototype with itemized obligations and constrained Gemma selection"
requires-python = ">=3.10"
dependencies = ["Flask==3.1.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kasimargin*"]

[project.optional-dependencies]
evaluation = ["psutil==7.2.2"]

[tool.kasimargin]
stage = "local-foundation-synthetic-prototype"
models = ["gemma4:e2b", "gemma4:e4b"]
model_execution = "OPTIONAL_EXPLICIT_LOCAL_REQUEST"
